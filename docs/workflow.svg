<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1810" viewBox="0 0 1120 1810" role="img" aria-labelledby="title desc">
  <title id="title">报告制作流程</title>
  <desc id="desc">居中的任务设置、报告要求收集与核对、模板确认、执行、材料检查和最终编译。模板及写作分支左右均衡，补充操作位于材料检查右侧。</desc>
  <style>
  :root { color-scheme: light dark; }
  .bg { fill: #f8fbf9; }
  .box { fill: #fff; stroke: #95b3a4; stroke-width: 1.5; }
  .accent { fill: #e8f5ee; stroke: #3e9065; }
  .decision { fill: #e8f5ee; stroke: #3e9065; stroke-width: 1.5; }
  .note { fill: #f1f5f2; stroke: #a9bdb1; stroke-width: 1.3; stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: #789587; stroke-width: 1.6; stroke-linejoin: round; }
  .dashed { stroke-dasharray: 5 4; }
  .arrow { fill: #789587; }
  .text { fill: #193e2b; font: 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle; }
  .label { fill: #52715f; font: 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #111c16; }
    .box { fill: #172b20; stroke: #4e7c61; }
    .accent, .decision { fill: #163d28; stroke: #70b58c; }
    .note { fill: #17261d; stroke: #55765f; }
    .edge { stroke: #7eaa90; }
    .arrow { fill: #7eaa90; }
    .text { fill: #d9eee1; }
    .label { fill: #a4c8b2; }
  }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 Z" />
    </marker>
  </defs>
  <rect class="bg" width="1120" height="1810" rx="20" />
  <path class="edge" d="M560 106 V129" marker-end="url(#arrow)" />
  <path class="edge" d="M560 201 V224" marker-end="url(#arrow)" />
  <path class="edge" d="M560 296 V321" marker-end="url(#arrow)" />
  <path class="edge" d="M560 411 V426 H250 V449" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M560 411 V426 H870 V449" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M250 521 V551" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 521 V551" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M250 639 V669" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 639 V669" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M250 741 V765 H560 V787" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 741 V765 H560" transform="translate(0 130)" />
  <path class="edge" d="M560 863 V899" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M560 975 V1014" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M655 1060 H705" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 1101 V1130 H625 V1075" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge dashed" d="M415 1060 H465" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M560 1106 V1189" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M560 1281 V1300 H250 V1323" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M560 1281 V1300 H870 V1323" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M250 1407 V1443" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 1407 V1443" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M250 1527 V1560 H560 V1587" marker-end="url(#arrow)" transform="translate(0 130)" />
  <path class="edge" d="M870 1527 V1560 H560" transform="translate(0 130)" />
  <rect class="box accent" x="290.0" y="34.0" width="540" height="72" rx="14" />
  <text class="text" x="560" y="70.0" dominant-baseline="middle">① 报告类型：内置 / 已保存 / 新增自定义</text>
  <rect class="box" x="290.0" y="129.0" width="540" height="72" rx="14" />
  <text class="text" x="560" y="165.0" dominant-baseline="middle">② 确认工作目录</text>
  <rect class="box" x="290.0" y="224.0" width="540" height="72" rx="14" />
  <text class="text" x="560" y="260.0" dominant-baseline="middle">③ 执行模式：自动 / 引导 / 混合</text>
  <path class="decision" d="M560 319.0 L665.0 365 L560 411.0 L455.0 365 Z" transform="translate(0 130)" />
  <text class="text" x="560" y="365.0" dominant-baseline="middle" transform="translate(0 130)">模板来源</text>
  <rect class="box" x="85.0" y="449.0" width="330" height="72" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="485.0" dominant-baseline="middle" transform="translate(0 130)">内置或已保存的模板</text>
  <rect class="box" x="705.0" y="449.0" width="330" height="72" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="485.0" dominant-baseline="middle" transform="translate(0 130)">新增自定义模板</text>
  <rect class="box" x="85.0" y="551.0" width="330" height="88" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="582.0" dominant-baseline="middle" transform="translate(0 130)">复制模板与依赖</text>
  <text class="text" x="250" y="608.0" dominant-baseline="middle" transform="translate(0 130)">保留独立的报告副本</text>
  <rect class="box" x="705.0" y="551.0" width="330" height="88" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="582.0" dominant-baseline="middle" transform="translate(0 130)">接收 TeX；非 TeX 经许可后</text>
  <text class="text" x="870" y="608.0" dominant-baseline="middle" transform="translate(0 130)">按截图开发、编译并预览</text>
  <rect class="box" x="85.0" y="669.0" width="330" height="72" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="705.0" dominant-baseline="middle" transform="translate(0 130)">核对模板样式与依赖</text>
  <rect class="box" x="705.0" y="669.0" width="330" height="72" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="692.0" dominant-baseline="middle" transform="translate(0 130)">确认用途：仅本次使用</text>
  <text class="text" x="870" y="718.0" dominant-baseline="middle" transform="translate(0 130)">或命名后加入本地模板库</text>
  <rect class="box accent" x="290.0" y="787.0" width="540" height="76" rx="14" transform="translate(0 130)" />
  <text class="text" x="560" y="825.0" dominant-baseline="middle" transform="translate(0 130)">模板确认后，询问额外自定义需求</text>
  <rect class="box" x="290.0" y="899.0" width="540" height="76" rx="14" transform="translate(0 130)" />
  <text class="text" x="560" y="937.0" dominant-baseline="middle" transform="translate(0 130)">记录答复，讨论计划并执行任务</text>
  <rect class="note" x="85.0" y="1019.0" width="330" height="82" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="1047.0" dominant-baseline="middle" transform="translate(0 130)">进度与证据记录</text>
  <text class="text" x="250" y="1073.0" dominant-baseline="middle" transform="translate(0 130)">随任务执行持续更新</text>
  <path class="decision" d="M560 1014.0 L655.0 1060 L560 1106.0 L465.0 1060 Z" transform="translate(0 130)" />
  <text class="text" x="560" y="1060.0" dominant-baseline="middle" transform="translate(0 130)">材料齐备？</text>
  <rect class="box" x="705.0" y="1019.0" width="330" height="82" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="1047.0" dominant-baseline="middle" transform="translate(0 130)">补充操作、截图或数据</text>
  <text class="text" x="870" y="1073.0" dominant-baseline="middle" transform="translate(0 130)">按指定路径保存，或发到聊天</text>
  <path class="decision" d="M560 1189.0 L680.0 1235 L560 1281.0 L440.0 1235 Z" transform="translate(0 130)" />
  <text class="text" x="560" y="1235.0" dominant-baseline="middle" transform="translate(0 130)">由谁撰写全文？</text>
  <rect class="box" x="85.0" y="1323.0" width="330" height="84" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="1352.0" dominant-baseline="middle" transform="translate(0 130)">当前 Agent：询问语言风格</text>
  <text class="text" x="250" y="1378.0" dominant-baseline="middle" transform="translate(0 130)">默认：朴素、清晰</text>
  <rect class="box" x="705.0" y="1323.0" width="330" height="84" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="1352.0" dominant-baseline="middle" transform="translate(0 130)">其他 Agent：准备接力</text>
  <text class="text" x="870" y="1378.0" dominant-baseline="middle" transform="translate(0 130)">生成骨干 TeX 和交接 Prompt</text>
  <rect class="box" x="85.0" y="1443.0" width="330" height="84" rx="14" transform="translate(0 130)" />
  <text class="text" x="250" y="1485.0" dominant-baseline="middle" transform="translate(0 130)">当前 Agent 撰写完整 TeX</text>
  <rect class="box" x="705.0" y="1443.0" width="330" height="84" rx="14" transform="translate(0 130)" />
  <text class="text" x="870" y="1472.0" dominant-baseline="middle" transform="translate(0 130)">用户转交自己选择的 AI</text>
  <text class="text" x="870" y="1498.0" dominant-baseline="middle" transform="translate(0 130)">将返回的 TeX 发回当前对话</text>
  <rect class="box accent" x="290.0" y="1587.0" width="540" height="76" rx="14" transform="translate(0 130)" />
  <text class="text" x="560" y="1625.0" dominant-baseline="middle" transform="translate(0 130)">原 Agent 检查、编译并交付 PDF</text>
  <text class="label" x="475" y="412" dominant-baseline="middle" transform="translate(0 130)">内置 / 已保存</text>
  <text class="label" x="645" y="412" dominant-baseline="middle" transform="translate(0 130)">新增自定义</text>
  <text class="label" x="680" y="1041.0" dominant-baseline="middle" transform="translate(0 130)">否</text>
  <text class="label" x="583" y="1148.0" dominant-baseline="middle" transform="translate(0 130)">是</text>
  <path class="edge" d="M560 409 V449" marker-end="url(#arrow)" />
  <rect class="box accent" x="290" y="321" width="540" height="88" rx="14" />
  <text class="text" x="560" y="352" dominant-baseline="middle">索取任务书、评分标准和格式要求</text>
  <text class="text" x="560" y="378" dominant-baseline="middle">接受口述，整理清单并请用户核对</text>
</svg>
